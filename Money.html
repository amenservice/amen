<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>ᗩᗰᕮᑎ 𝐌𝐨𝐛𝐢𝐥𝐞 𝐌𝐨𝐧𝐞𝐲 𝐀𝐠𝐞𝐧𝐭</title>
    <meta property="og:title" content="ᗩᗰᕮᑎ 𝐌𝐨𝐛𝐢𝐥𝐞 𝐌𝐨𝐧𝐞𝐲 𝐀𝐠𝐞𝐧𝐭">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --body-bg: linear-gradient(90deg, rgba(203, 213, 225, 0.6) 0%, #f8fafc 25%, #f8fafc 75%, rgba(203, 213, 225, 0.6) 100%);
            --card-bg: #ffffff; 
            --title-clr: #0f172a;
            --input-clr: #0f172a;
            --label-clr: #475569;
            --tabs-bg: #f1f5f9;
            --tab-clr: #64748b;
            --date-color: #7c3aed;
            --line-weight: 3px;
            --messenger-clr: #0084ff; 
            --viber-clr: #7360f2; 
            --telegram-clr: #229ED9; 
            --whatsapp-clr: #25D366;
            --line-clr: #06C755; 
            --vv-height: 100vh;
            --rainbow-1: linear-gradient(90deg, #ff8a80, #ffd180, #ffff8d, #b9f6ca, #80d8ff, #b388ff, #ff8a80);
            --rainbow-2: linear-gradient(120deg, #b9f6ca, #80d8ff, #b388ff, #ff8a80, #ffd180, #ffff8d, #b9f6ca);
            --rainbow-3: linear-gradient(60deg, #b388ff, #80d8ff, #b9f6ca, #ffff8d, #ffd180, #ff8a80, #b388ff);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --body-bg: linear-gradient(90deg, rgba(15, 23, 42, 0.9) 0%, #090d16 25%, #090d16 75%, rgba(15, 23, 42, 0.9) 100%);
                --card-bg: #111827; 
                --title-clr: #f8fafc;
                --input-clr: #f8fafc;
                --label-clr: #94a3b8;
                --tabs-bg: #1f2937;
                --tab-clr: #9ca3af;
                --date-color: #a78bfa;
            }
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, input, .stretch-label, .tab, .clock-time, .clock-date, .footer-clean, .currency-swipe-box { 
            font-family: 'MedievalSharp', 'myanmarayar3', 'Myanmar3', 'Pyidaungsu', 'Noto Sans Myanmar', sans-serif; 
        }
        
        body { 
            background: var(--body-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: var(--vv-height); 
            height: var(--vv-height);
            width: 100vw;
            padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
            overflow: hidden; 
            transition: background 0.4s ease;
        }

        @keyframes flowCard { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        @keyframes flowTabs { 0% { background-position: 200% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes flowInput { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .card { 
            width: 100%; 
            max-width: 380px; 
            height: 96%; 
            max-height: 750px; 
            border-radius: 32px; 
            padding: var(--line-weight); 
            background: var(--card-bg);
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(15, 23, 42, 0.05);
            display: flex;
            margin: auto; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: var(--line-weight);
            background: var(--rainbow-1);
            background-size: 200% 100%;
            animation: flowCard 9s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
        }
        
        .card-inner { 
            background: var(--card-bg); 
            border-radius: 50px; 
            width: 100%; 
            height: 100%;
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            padding: 10px 18px; 
            justify-content: space-evenly; 
            align-items: center;
            transition: background 0.4s ease, color 0.4s ease;
            position: relative;
            z-index: 2;
        }

        .money-app h1 { 
            font-size: min(12vw, 70px);
            font-weight: 900;
            font-family: 'MedievalSharp', sans-serif; 
            margin: 0; 
            line-height: 0.95; 
            filter: drop-shadow(2px 3px 4px rgba(15, 23, 42, 0.15));
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .c-yellow { color: #f59e0b; font-weight: 900; }
        .c-green { color: #10b981; font-weight: 900; }
        .c-red { color: #ef4444; font-weight: 900; }
        .c-blue { color: #3b82f6; font-weight: 900; }
        
        .agent-title { 
            font-family: 'MedievalSharp', sans-serif; 
            font-size: min(3vw, 10px); 
            font-weight: 900; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            text-transform: uppercase; 
            color: var(--title-clr);
            width: 100%;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .agent-title .clr-mobile { color: #d97706; font-weight: 900; }
        .agent-title .clr-money { color: #059669; font-weight: 900; }
        .agent-title .clr-agent { color: #dc2626; font-weight: 900; }
        
        #status-light { 
            display: flex; 
            flex-direction: row;
            align-items: center; 
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .clock-time, .clock-date {
            color: var(--date-color);
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1;
            transition: color 0.4s ease;
            font-size: min(3.1vw, 0.75rem);
        }
        
        .clock-date { text-transform: uppercase; }

        .currency-swipe-box {
            position: relative;
            width: 100%;
            padding: 8px 0;
            background: transparent;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            user-select: none;
            touch-action: pan-y;
            overflow: hidden;
            flex-shrink: 0;
        }

        .currency-swipe-box:active {
            cursor: grabbing;
        }

        .currency-carousel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 4px;
        }

        .currency-item {
            font-size: min(2.8vw, 0.75rem);
            font-weight: 600;
            color: var(--label-clr);
            opacity: 0.4;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-align: center;
            flex: 1;
            cursor: pointer;
        }

        .currency-item:hover {
            opacity: 0.8;
        }

        .currency-item.active {
            font-size: min(4.2vw, 1.05rem);
            font-weight: 800;
            color: var(--input-clr);
            opacity: 1;
            transform: scale(1.05);
            flex: 1.5;
            cursor: default;
        }
        
        .tabs { 
            position: relative;
            width: 100%;
            display: flex; 
            background: var(--tabs-bg); 
            padding: 4px; 
            border-radius: 50px; 
            box-shadow: inset 0 2px 4px 0 rgba(15, 23, 42, 0.06);
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
            flex-shrink: 0;
            transition: background 0.4s ease;
        }

        .tabs::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: var(--line-weight);
            background: var(--rainbow-2);
            background-size: 200% 100%;
            animation: flowTabs 6.5s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
        }
        
        .slide-indicator {
            position: absolute;
            top: 4px; bottom: 4px; left: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            transform: translateX(0);
        }
        
        .slide-indicator.sell-mode { transform: translateX(100%); }

        .tab { 
            position: relative;
            z-index: 2;
            flex: 1; 
            padding: 5px 4px; 
            text-align: center; 
            font-weight: 800; 
            color: var(--tab-clr); 
            font-size: min(3.5vw, 0.85rem); 
            cursor: pointer; 
            border-radius: 50px; 
            transition: color 0.35s cubic-bezier(0.4, 0, 0.2, 1); 
            letter-spacing: 0.5px;
        }

        .tab.active { color: #ffffff; }
        
        .tab-content { display: none; }
        .tab-content.active { display: contents; }

        .input-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .money-input-box { 
            background: transparent;
            position: relative;
            padding: 2px 2px; 
            transition: all 0.3s ease; 
        }

        .money-input-box::after {
            content: '';
            position: absolute;
            left: 0; bottom: 0; width: 100%;
            height: var(--line-weight);
            background: var(--rainbow-3);
            background-size: 200% 100%;
            animation: flowInput 5s linear infinite;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .input-row:nth-child(2) .money-input-box::after {
            animation-duration: 4.2s; animation-delay: -2s;
        }

        .money-input-box:focus-within::after, .money-input-box.highlighted::after {
            opacity: 1;
            box-shadow: 0 2px 8px rgba(179, 136, 255, 0.3);
        }
        
        .money-input-box input { 
            width: 100%; 
            border: none; 
            background: transparent; 
            font-size: min(6.5vw, 1.5rem); 
            text-align: right; 
            font-weight: 800; 
            color: var(--input-clr); 
            outline: none; 
            position: relative;
            z-index: 1;
            letter-spacing: 0.5px;
            transition: color 0.4s ease;
        }

        .money-app .stretch-label { 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-weight: 800; 
            color: var(--label-clr); 
            font-size: min(3vw, 0.75rem); 
            letter-spacing: 0.5px; 
            text-transform: uppercase;
            margin-bottom: 1px;
            transition: color 0.4s ease;
        }
        
        .social-container { 
            display: flex; 
            justify-content: space-evenly; 
            align-items: center; 
            width: 100%; 
            max-width: 320px;
            margin: 0 auto;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        
        .social-icon { 
            font-size: min(6vw, 1.5rem); 
            transition: all 0.3s ease; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: min(8.5vw, 34px); 
            height: min(8.5vw, 34px); 
            background: transparent; 
            text-decoration: none !important; 
        }
        .social-icon * { text-decoration: none !important; border: none !important; }
        
        .messenger { color: var(--messenger-clr); }
        .viber { color: var(--viber-clr); }
        .telegram { color: var(--telegram-clr); }
        .whatsapp { color: var(--whatsapp-clr); }
        .line { color: var(--line-clr); }
        .social-icon:hover { transform: translateY(-4px) scale(1.12); }
        
        .footer-clean { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: min(2.6vw, 0.45rem); 
            font-weight: 800; 
            color: var(--label-clr); 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            transition: all 0.25s ease; 
            flex-shrink: 0;
            white-space: nowrap;
        }

        body.keyboard-open .card {
            height: 100%; border-radius: 16px; box-shadow: none;
        }

        body.keyboard-open .card-inner {
            padding: 8px 12px; justify-content: center; gap: 8px;
        }

        body.keyboard-open h1,
        body.keyboard-open .agent-title,
        body.keyboard-open #status-light,
        body.keyboard-open .currency-swipe-box,
        body.keyboard-open .social-container,
        body.keyboard-open .footer-clean {
            display: none !important;
        }

        body.keyboard-open .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="card money-app" id="mainCard">
    <div class="card-inner">
        
        <h1>
            <span class="c-yellow">ᗩ</span>
            <span class="c-green">ᗰ</span>
            <span class="c-red">ᕮ</span>

        </h1>
        
        <div class="agent-title">
            <span class="clr-mobile">M</span><span class="clr-mobile">O</span><span class="clr-mobile">B</span><span class="clr-mobile">I</span><span class="clr-mobile">L</span><span class="clr-mobile">E</span>
            <span class="clr-money">M</span><span class="clr-money">O</span><span class="clr-money">N</span><span class="clr-money">E</span><span class="clr-money">Y</span>

        <div class="currency-swipe-box" id="currencySwipeBox">

            <div class="input-row">
                <div class="stretch-label"><span>AMOUNT</span><span>{MMK}</span></div>
                <div class="money-input-box"><input type="text" id="mmkSell" placeholder="0" inputmode="decimal"></div>
            </div>
            <div class="input-row">
                <div class="stretch-label"><span id="lblSellForeign">FOREIGN</span><span id="codeSellForeign">{CUR}</span></div>
                <div class="money-input-box"><input type="text" id="foreignSell" placeholder="0" inputmode="decimal"></div>
            </div>
        </div>

        <div class="social-container">
            <a href="https://m.me/amenmobilemoneyagent" class="social-icon messenger"><i class="fa-brands fa-facebook-messenger"></i></a>
            <a href="viber://chat?number=%2B66947841411" class="social-icon viber"><i class="fa-brands fa-viber"></i></a>
            <a href="https://t.me/amenmobilemoneyagent" class="social-icon telegram"><i class="fa-brands fa-telegram"></i></a>
            <a href="https://api.whatsapp.com/send?phone=66947841411" class="social-icon whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://line.me/ti/p/~mobilemoneyagent" class="social-icon line"><i class="fa-brands fa-line"></i></a>
        </div>

        <div class="footer-clean">
            <span>M</span><span>O</span><span>B</span><span>I</span><span>L</span><span>E</span>
            <span>M</span><span>O</span><span>N</span><span>E</span><span>Y</span>
            <span>A</span><span>G</span><span>E</span><span>N</span><span>T</span>
            <span>©</span>
            <span>2</span><span>0</span><span>2</span><span>6</span>
        </div>

    </div>
</div>

<script>
    const MONEY_API = 'https://script.google.com/macros/s/AKfycbygZa3_x7wINmNvUy-ZjmcxydgR4b2BJ0T1Q42XC20ers3PlHXMGFA2gW3rh1cYwL8U/exec';
    
    let CURRENCIES = {
        AED: { name: "United Arab Emirates (AED)", buy: 1173, sell: 1204 },
        AUD: { name: "Australia (AUD)", buy: 3025, sell: 3105 },
        CAD: { name: "Canada (CAD)", buy: 3075, sell: 3155 },
        CNY: { name: "China (CNY)", buy: 638, sell: 655 },
        EUR: { name: "European Union (EUR)", buy: 4965, sell: 5100 },
        GBP: { name: "United Kingdom (GBP)", buy: 5810, sell: 5960 },
        HKD: { name: "Hong Kong (HKD)", buy: 549, sell: 564 },
        IDR: { name: "Indonesia (IDR)", buy: 0.27, sell: 0.29 },
        INR: { name: "India (INR)", buy: 45.17, sell: 46.37 },
        JPY: { name: "Japan (JPY)", buy: 27.34, sell: 28.07 },
        KHR: { name: "Cambodia (KHR)", buy: 1.07, sell: 1.1 },
        KRW: { name: "South Korea (KRW)", buy: 2.98, sell: 3.06 },
        LAK: { name: "Laos (LAK)", buy: 0.19, sell: 0.2 },
        MOP: { name: "Macau (MOP)", buy: 536, sell: 547 },
        MYR: { name: "Malaysia (MYR)", buy: 1053, sell: 1081 },
        NZD: { name: "New Zealand (NZD)", buy: 2530, sell: 2600 },
        PHP: { name: "Philippines (PHP)", buy: 70.36, sell: 72.22 },
        SGD: { name: "Singapore (SGD)", buy: 3360, sell: 3450 },
        THB: { name: "Thailand (THB)", buy: 129.03, sell: 132.45 },
        TWD: { name: "Taiwan (TWD)", buy: 133, sell: 137 },
        USD: { name: "United States (USD)", buy: 4310, sell: 4420 },
        VND: { name: "Vietnam (VND)", buy: 0.16, sell: 0.17 }
    };

    let sortedKeys = Object.keys(CURRENCIES).sort();
    let currentCurrencyIndex = sortedKeys.indexOf('THB') !== -1 ? sortedKeys.indexOf('THB') : 0;
    let selectedCurrency = sortedKeys[currentCurrencyIndex];

    let lastActiveInput = null;
    let apiStatus = 'connecting'; 
    let currentTabMode = 'buy';

    function updateDisplay() {
        selectedCurrency = sortedKeys[currentCurrencyIndex];
        let prevIndex = (currentCurrencyIndex - 1 + sortedKeys.length) % sortedKeys.length;
        let nextIndex = (currentCurrencyIndex + 1) % sortedKeys.length;

        document.getElementById('prevCurrencyText').textContent = CURRENCIES[sortedKeys[prevIndex]].name;
        document.getElementById('currentSelectedText').textContent = CURRENCIES[selectedCurrency].name;
        document.getElementById('nextCurrencyText').textContent = CURRENCIES[sortedKeys[nextIndex]].name;

        document.getElementById('codeBuyForeign').textContent = `{${selectedCurrency}}`;
        document.getElementById('codeSellForeign').textContent = `{${selectedCurrency}}`;
    }

    function nextCurrency() {
        currentCurrencyIndex = (currentCurrencyIndex + 1) % sortedKeys.length;
        updateDisplay();
        if (lastActiveInput) {
            lastActiveInput.dispatchEvent(new Event('input'));
        }
    }

    function prevCurrency() {
        currentCurrencyIndex = (currentCurrencyIndex - 1 + sortedKeys.length) % sortedKeys.length;
        updateDisplay();
        if (lastActiveInput) {
            lastActiveInput.dispatchEvent(new Event('input'));
        }
    }

    const swipeBox = document.getElementById('currencySwipeBox');
    let touchStartX = 0;
    let touchStartTime = 0;

    swipeBox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].clientX;
        touchStartTime = Date.now();
    }, {passive: true});

    swipeBox.addEventListener('touchend', (e) => {
        let touchEndX = e.changedTouches[0].clientX;
        let diff = touchEndX - touchStartX;
        let elapsed = Date.now() - touchStartTime;
        
        if (Math.abs(diff) > 30 || (elapsed < 300 && Math.abs(diff) > 10)) {
            if (diff > 0) {
                prevCurrency();
            } else {
                nextCurrency();
            }
        }
    }, {passive: true});

    function handleViewportChange() {
        if (window.visualViewport) {
            const vv = window.visualViewport;
            document.documentElement.style.setProperty('--vv-height', `${vv.height}px`);
            
            if (window.innerHeight - vv.height > 140) {
                document.body.classList.add('keyboard-open');
            } else {
                document.body.classList.remove('keyboard-open');
            }
        } else {
            document.documentElement.style.setProperty('--vv-height', `${window.innerHeight}px`);
        }
    }

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', handleViewportChange);
        window.visualViewport.addEventListener('scroll', handleViewportChange);
    }
    window.addEventListener('resize', handleViewportChange);
    window.addEventListener('load', handleViewportChange);

    function updateLiveClock() {
        const now = new Date();
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dayName = days[now.getDay()];
        
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        
        const statusLight = document.getElementById('status-light');

        let statusColor = '#f59e0b';
        if (apiStatus === 'online') {
            statusColor = '#10b981';
        } else if (apiStatus === 'offline') {
            statusColor = '#ef4444';
        }

        statusLight.innerHTML = `
            <div class="clock-time" style="color: ${statusColor}">${hh}:${min}:${ss}</div>
            <div class="clock-date" style="color: ${statusColor}">${dayName} ${dd},${mm},${yyyy}</div>
        `;
    }

    async function syncMoneyData() {
        try {
            const res = await fetch(`${MONEY_API}?cache=${Date.now()}`);
            const data = await res.json();
            apiStatus = 'online';
            
            if (data && typeof data === 'object') {
                for (let code in data) {
                    if (CURRENCIES[code]) {
                        if (data[code].buy) CURRENCIES[code].buy = parseFloat(data[code].buy);
                        if (data[code].sell) CURRENCIES[code].sell = parseFloat(data[code].sell);
                    }
                }
            }
            if (lastActiveInput) { lastActiveInput.dispatchEvent(new Event('input')); }
        } catch (e) {
            apiStatus = 'offline';
        }
        updateLiveClock(); 
    }

    updateDisplay();
    updateLiveClock();
    setInterval(updateLiveClock, 1000);
    syncMoneyData(); 
    setInterval(syncMoneyData, 3000);

    const format = (v, isTyping = false) => {
        if (!v && v !== 0) return "";
        let parts = v.toString().split(".");
        parts[0] = parts[0].replace(/,/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        if (parts.length > 1) return parts[0] + "." + parts[1];
        return parts[0] + (isTyping && v.toString().includes(".") ? "." : "");
    };
    
    const raw = (v) => parseFloat(v.toString().replace(/,/g, "")) || 0;

    function getAdjustedRate(baseRate, mmkAmount, isBuyTab) {
        let percentage = 1.0;
        if (mmkAmount <= 100000) percentage = 1.0;
        else if (mmkAmount >= 150000000) percentage = 0.25;
        else {
            let ratio = (mmkAmount - 100000) / (150000000 - 100000);
            percentage = 1.0 - (ratio * (1.0 - 0.25));
        }
        let mult = 1.0 + (percentage / 100);
        return isBuyTab ? (baseRate / mult) : (baseRate * mult);
    }

    function updateGlow(inputEl, hasValue) {
        let activeContent = document.querySelector('.tab-content.active');
        if (activeContent) {
            activeContent.querySelectorAll('.money-input-box').forEach(box => {
                hasValue ? box.classList.add('highlighted') : box.classList.remove('highlighted');
            });
        }
    }
    
    function handleForeignInput(inputEl, outputId, isBuy) {
        lastActiveInput = inputEl; 
        let foreignVal = raw(inputEl.value); 
        inputEl.value = format(inputEl.value, true);
        if (!inputEl.value) { document.getElementById(outputId).value = ""; updateGlow(inputEl, false); return; }
        updateGlow(inputEl, true);
        
        let currObj = CURRENCIES[selectedCurrency];
        let baseRate = isBuy ? currObj.buy : currObj.sell;

        let roughMmk = foreignVal * baseRate;
        let adjustedRate = getAdjustedRate(baseRate, roughMmk, isBuy);

        let finalMMK = foreignVal * adjustedRate;
        document.getElementById(outputId).value = format(Math.round(finalMMK));
    }

    function handleMMKInput(inputEl, outputId, isBuy) {
        lastActiveInput = inputEl; 
        let mmk = raw(inputEl.value); 
        inputEl.value = format(inputEl.value, true);
        if (!inputEl.value) { document.getElementById(outputId).value = ""; updateGlow(inputEl, false); return; }
        updateGlow(inputEl, true);
        
        let currObj = CURRENCIES[selectedCurrency];
        let baseRate = isBuy ? currObj.buy : currObj.sell;

        let adjustedRate = getAdjustedRate(baseRate, mmk, isBuy);
        let finalForeign = mmk / adjustedRate;
        
        let decimals = 2;
        document.getElementById(outputId).value = format(parseFloat(finalForeign.toFixed(decimals)));
    }

    document.getElementById('foreignBuy').oninput = function() { handleForeignInput(this, 'mmkBuy', true); };
    document.getElementById('mmkBuy').oninput = function() { handleMMKInput(this, 'foreignBuy', true); };
    document.getElementById('mmkSell').oninput = function() { handleMMKInput(this, 'foreignSell', false); };
    document.getElementById('foreignSell').oninput = function() { handleForeignInput(this, 'mmkSell', false); };

    function switchTab(name) {
        if (currentTabMode === name) return;
        currentTabMode = name;

        const indicator = document.getElementById('slideIndicator');
        const tabBuy = document.getElementById('tabBuy');
        const tabSell = document.getElementById('tabSell');

        if (name === 'buy') {
            indicator.classList.remove('sell-mode');
            tabBuy.classList.add('active');
            tabSell.classList.remove('active');
            document.getElementById('buyContent').classList.add('active');
            document.getElementById('sellContent').classList.remove('active');
        } else {
            indicator.classList.add('sell-mode');
            tabSell.classList.add('active');
            tabBuy.classList.remove('active');
            document.getElementById('sellContent').classList.add('active');
            document.getElementById('buyContent').classList.remove('active');
        }

        document.querySelectorAll('.money-input-box').forEach(b => b.classList.remove('highlighted'));
        lastActiveInput = null;
    }

    const tabContainer = document.getElementById('tabContainer');
    const indicator = document.getElementById('slideIndicator');
    
    let touchStartXTab = 0;
    let isDraggingTab = false;
    let indicatorWidth = 0;

    tabContainer.addEventListener('touchstart', (e) => {
        touchStartXTab = e.changedTouches[0].clientX;
        isDraggingTab = true;
        indicatorWidth = indicator.offsetWidth;
        indicator.style.transition = 'none'; 
    }, {passive: true});

    tabContainer.addEventListener('touchmove', (e) => {
        if (!isDraggingTab) return;
        let currentX = e.changedTouches[0].clientX;
        let diff = currentX - touchStartXTab;
        
        let movePx = 0;
        if (currentTabMode === 'buy') {
            movePx = Math.max(0, Math.min(diff, indicatorWidth));
        } else {
            movePx = Math.max(-indicatorWidth, Math.min(diff, 0)) + indicatorWidth;
        }
        indicator.style.transform = `translateX(${movePx}px)`;
    }, {passive: true});

    tabContainer.addEventListener('touchend', (e) => {
        if (!isDraggingTab) return;
        isDraggingTab = false;
        indicator.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
        indicator.style.transform = ''; 
        
        let touchEndX = e.changedTouches[0].clientX;
        let threshold = indicatorWidth / 3;

        if (currentTabMode === 'buy' && touchEndX - touchStartXTab > threshold) {
            switchTab('sell'); 
        } else if (currentTabMode === 'sell' && touchStartXTab - touchEndX > threshold) {
            switchTab('buy');
        }
    }, {passive: true});
</script>
</body>
