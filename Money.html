/* Equal-size four amount boxes */
.equal-box-layout,
.tab-content.active {
  width: 100%;
}
.tab-content.active {
  display: flex ;
  flex-direction: column ;
  gap: 9px ;
}
.tab-content .input-row {
  width: 100% ;
  height: 78px ;
  min-height: 78px ;
  margin: 0 ;
  display: flex ;
  flex-direction: column ;
  justify-content: space-between ;
}
.tab-content .stretch-label {
  height: 14px ;
  min-height: 14px ;
  line-height: 14px ;
  margin: 0 5px 6px ;
}
.tab-content .money-input-box {
  width: 100% ;
  height: 58px ;
  min-height: 58px ;
  flex: 0 0 58px ;
}
.tab-content .money-input-box input {
  height: 56px ;
  min-height: 56px ;
}
.currency-vertical-box {
  width: 100% ;
  height: 58px ;
  min-height: 58px ;
  padding: 8px 9px ;
}
.tabs {
  width: 100% ;
  height: 58px ;
  min-height: 58px ;
  align-items: stretch ;
}
.tabs .tab {
  height: 48px ;
  min-height: 48px ;
  display: grid ;
  place-items: center ;
}
@media (max-width: 360px) {
  .currency-vertical-box {
    height: 52px ;
    min-height: 52px ;
    padding: 7px 9px ;
  }
  .tabs {
    height: 52px ;
    min-height: 52px ;
  }
  .tabs .tab {
    height: 42px ;
    min-height: 42px ;
  }
  .tab-content.active { gap: 7px ; }
  .tab-content .input-row {
    height: 70px ;
    min-height: 70px ;
  }
  .tab-content .money-input-box {
    height: 52px ;
    min-height: 52px ;
    flex-basis: 52px ;
  }
  .tab-content .money-input-box input {
    height: 50px ;
    min-height: 50px ;
  }
}

/* Unified four-box border system and clear horizontal navigation */
.currency-vertical-box,
.tabs,
.tab-content .money-input-box {
  border: 1px solid rgba(255,255,255,.72) ;
  border-radius: 19px ;
  box-shadow: 0 6px 15px rgba(127,83,128,.08) ;
}
.currency-vertical-box {
  overflow: visible ;
}
.currency-btn {
  display: grid ;
  place-items: center ;
  width: 32px ;
  height: 32px ;
  border: 1px solid rgba(255,255,255,.55) ;
  border-radius: 50% ;
  background: rgba(255,255,255,.16) ;
  color: #fff7c7 ;
  box-shadow: 0 3px 8px rgba(76,42,86,.18) ;
}
.currency-btn i {
  display: none ;
}
.currency-btn::before {
  font-family: Arial, sans-serif ;
  font-size: 27px ;
  font-weight: 700 ;
  line-height: 1 ;
  color: #fff7c7 ;
  text-shadow: 0 1px 3px rgba(70,35,70,.45) ;
}
.currency-btn:first-child::before {
  content: "‹" ;
}
.currency-btn:last-child::before {
  content: "›" ;
}
.currency-btn:hover {
  background: rgba(255,255,255,.32) ;
  transform: scale(1.08) ;
}

/* Minimal, elegant country navigation arrows */
.currency-btn {
  width: 30px ;
  height: 38px ;
  border: 0 ;
  border-radius: 0 ;
  background: transparent ;
  box-shadow: none ;
  color: #fff7c7 ;
  outline: none ;
}
.currency-btn::before {
  font-family: Arial, sans-serif ;
  font-size: 34px ;
  font-weight: 300 ;
  line-height: 1 ;
  color: #fff7c7 ;
  text-shadow: 0 1px 3px rgba(70,35,70,.4) ;
}
.currency-btn:first-child::before { content: "‹" ; }
.currency-btn:last-child::before { content: "›" ; }
.currency-btn:hover {
  background: transparent ;
  box-shadow: none ;
  transform: scale(1.12) ;
  color: #ffffff ;
}

/* Balanced spacing for country navigation arrows */
.currency-vertical-box {
  grid-template-columns: 36px minmax(0, 1fr) 36px ;
  gap: 8px ;
  padding-left: 12px ;
  padding-right: 12px ;
}
.currency-vertical-box .currency-btn {

      <div class="social-container"><div class="platform-item"><a href="https://m.me/amenmobilemoneyagent" class="social-icon messenger" aria-label="Messenger"><i class="fa-brands fa-facebook-messenger"></i></a></div><div class="platform-item"><a href="viber://chat?number=%2B66947841411" class="social-icon viber" aria-label="Viber"><i class="fa-brands fa-viber"></i></a></div><div class="platform-item"><a href="https://t.me/amenmobilemoneyagent" class="social-icon telegram" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a></div><div class="platform-item"><a href="https://api.whatsapp.com/send?phone=66947841411" class="social-icon whatsapp" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a></div><div class="platform-item"><a href="https://line.me/ti/p/~mobilemoneyagent" class="social-icon line" aria-label="LINE"><i class="fa-brands fa-line"></i></a></div></div>
      <div class="availability">Your trusted agent, available 24/7</div><div class="footer-clean"><span>AMEN MOBILE MONEY AGENT&nbsp;© 2026</span></div>
    </div>
  </main>
  <script>
    const MONEY_API = 'https://script.google.com/macros/s/AKfycbygZa3_x7wINmNvUy-ZjmcxydgR4b2BJ0T1Q42XC20ers3PlHXMGFA2gW3rh1cYwL8U/exec';
    const CURRENCIES = {
      AED:{name:'United Arab Emirates',buy:null,sell:null}, AUD:{name:'Australia',buy:null,sell:null}, CAD:{name:'Canada',buy:null,sell:null},
      CNY:{name:'China',buy:null,sell:null}, EUR:{name:'European Union',buy:null,sell:null}, GBP:{name:'United Kingdom',buy:null,sell:null},
      HKD:{name:'Hong Kong',buy:null,sell:null}, INR:{name:'India',buy:null,sell:null}, JPY:{name:'Japan',buy:null,sell:null},
      KHR:{name:'Cambodia',buy:null,sell:null}, KRW:{name:'South Korea',buy:null,sell:null}, LAK:{name:'Laos',buy:null,sell:null},
      MOP:{name:'Macau',buy:null,sell:null}, MYR:{name:'Malaysia',buy:null,sell:null}, NZD:{name:'New Zealand',buy:null,sell:null},
      PHP:{name:'Philippines',buy:null,sell:null}, SGD:{name:'Singapore',buy:null,sell:null}, THB:{name:'Thailand',buy:null,sell:null},
      TWD:{name:'Taiwan',buy:null,sell:null}, USD:{name:'United States',buy:null,sell:null}, VND:{name:'Vietnam',buy:null,sell:null}
    };
    const $ = id => document.getElementById(id);
    const els = {
      prev:$('prevCurrencyText'), current:$('currentSelectedText'), next:$('nextCurrencyText'), codeBuy:$('codeBuyForeign'), codeSell:$('codeSellForeign'),
      rateStatus:$('inlineRateStatus'), liveIcon:$('liveRateIcon'), statusLight:$('status-light'), indicator:$('slideIndicator'),
      tabBuy:$('tabBuy'), tabSell:$('tabSell'), buyContent:$('buyContent'), sellContent:$('sellContent'), tabContainer:$('tabContainer'), currencyBox:$('currencyVerticalBox'),
      foreignBuy:$('foreignBuy'), mmkBuy:$('mmkBuy'), mmkSell:$('mmkSell'), foreignSell:$('foreignSell')
    };
    const sortedKeys = Object.keys(CURRENCIES).sort((a,b) => CURRENCIES[a].name.localeCompare(CURRENCIES[b].name));
    let currentCurrencyIndex = Math.max(0, sortedKeys.indexOf('THB'));
    let selectedCurrency = sortedKeys[currentCurrencyIndex];
    let lastActiveInput = null;
    let apiStatus = 'connecting';
    let currentTabMode = 'buy';
    let rateRequest = null;
    let rateTimer = 0;

    function updateDisplay() {
      selectedCurrency = sortedKeys[currentCurrencyIndex];
      const prev = sortedKeys[(currentCurrencyIndex - 1 + sortedKeys.length) % sortedKeys.length];
      const next = sortedKeys[(currentCurrencyIndex + 1) % sortedKeys.length];
      els.prev.textContent = CURRENCIES[prev].name;
      els.current.textContent = CURRENCIES[selectedCurrency].name;
      els.next.textContent = CURRENCIES[next].name;
      els.codeBuy.textContent = `{${selectedCurrency}}`;
      els.codeSell.textContent = `{${selectedCurrency}}`;
    }
    function refreshLastInput() { if (lastActiveInput) lastActiveInput.dispatchEvent(new Event('input')); }
    function nextCurrency() { currentCurrencyIndex = (currentCurrencyIndex + 1) % sortedKeys.length; updateDisplay(); refreshLastInput(); }
    function prevCurrency() { currentCurrencyIndex = (currentCurrencyIndex - 1 + sortedKeys.length) % sortedKeys.length; updateDisplay(); refreshLastInput(); }

    let touchStartX = 0, touchStartY = 0;
    els.currencyBox.addEventListener('touchstart', e => {
      const t = e.changedTouches[0];
      if (!t) return;
      touchStartX = t.clientX; touchStartY = t.clientY;
    }, {passive:true});
    els.currencyBox.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
      if (Math.abs(dx) >= Math.abs(dy)) { dx > 0 ? prevCurrency() : nextCurrency(); }
      else { dy > 0 ? prevCurrency() : nextCurrency(); }
    }, {passive:true});

    function handleViewportChange() {
      const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--vv-height', `${height}px`);
      document.body.classList.toggle('keyboard-open', window.innerHeight - height > 140);
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleViewportChange, {passive:true});
      window.visualViewport.addEventListener('scroll', handleViewportChange, {passive:true});
    }
    window.addEventListener('resize', handleViewportChange, {passive:true});
    window.addEventListener('load', handleViewportChange, {once:true});

    function updateLiveClock() {
      const now = new Date();
      const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];
      const month = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][now.getMonth()];
      const dd = String(now.getDate()).padStart(2,'0');
      const time = [now.getHours(),now.getMinutes(),now.getSeconds()].map(v => String(v).padStart(2,'0')).join(':');
      const date = `${day}, ${dd} ${month} ${now.getFullYear()}`;
      els.liveIcon.classList.toggle('status-online', apiStatus === 'online');
      els.liveIcon.classList.toggle('status-connecting', apiStatus === 'connecting');
      els.liveIcon.classList.toggle('status-offline', apiStatus === 'offline');
      els.liveIcon.title = apiStatus === 'online' ? 'Online — live rates updated' : apiStatus === 'connecting' ? 'Connecting to live rates' : 'Offline — check your connection';
      els.rateStatus.innerHTML = `${date} <span class="inline-time">${time}</span>`;
      els.statusLight.innerHTML = `<div class="clock-time">${time}</div><div class="clock-date">${date}</div>`;
    }

    async function syncMoneyData() {
      if (document.hidden) return;
      if (rateRequest) rateRequest.abort();
      const request = new AbortController();
      rateRequest = request;
      try {
        const res = await fetch(`${MONEY_API}?cache=${Date.now()}`, {signal:request.signal, cache:'no-store'});
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data && typeof data === 'object' && !Array.isArray(data)) {
          for (const [code, values] of Object.entries(data)) {
            if (!CURRENCIES[code] || !values || typeof values !== 'object') continue;
            const buy = Number(values.buy), sell = Number(values.sell);
            if (Number.isFinite(buy) && buy > 0) CURRENCIES[code].buy = buy;
            if (Number.isFinite(sell) && sell > 0) CURRENCIES[code].sell = sell;
          }
        }
        apiStatus = 'online';
        refreshLastInput();
      } catch (e) {
        if (e.name !== 'AbortError' && rateRequest === request) apiStatus = 'offline';
      } finally {
        if (rateRequest === request) rateRequest = null;
        updateLiveClock();
      }
    }
    function scheduleRateSync() { clearTimeout(rateTimer); rateTimer = setTimeout(() => { syncMoneyData(); scheduleRateSync(); }, 30000); }
    // Keep the displayed clock moving continuously while the page is open.
    const rateTabs = document.querySelector('.tabs');
    if (rateTabs && !document.querySelector('.rate-warning')) {
      const warning = document.createElement('div');
      warning.className = 'rate-warning';
      warning.textContent = "''Exchange rates may change over time''";
      rateTabs.parentNode.insertBefore(warning, rateTabs);
    }

    const clockTimer = window.setInterval(updateLiveClock, 1000);

    // Mobile pull-down gesture: refresh live rates when starting at the top of the page.
    let pullStartY = 0, pullStartX = 0, pullTracking = false;
    document.addEventListener('touchstart', e => {
      const touch = e.touches[0], target = e.target;
      pullTracking = window.scrollY <= 0 && !!touch && !target.closest('input,button,.tabs,.currency-vertical-box');
      if (pullTracking) { pullStartY = touch.clientY; pullStartX = touch.clientX; }
    }, {passive:true});
    document.addEventListener('touchend', e => {
      if (!pullTracking) return;
      pullTracking = false;
      const touch = e.changedTouches[0];
      if (!touch) return;
      const dy = touch.clientY - pullStartY, dx = Math.abs(touch.clientX - pullStartX);
      if (dy > 72 && dy > dx * 1.25) { apiStatus = 'connecting'; updateLiveClock(); syncMoneyData(); }
    }, {passive:true});
    document.addEventListener('touchcancel', () => { pullTracking = false; }, {passive:true});
    window.addEventListener('offline', () => { apiStatus='offline'; updateLiveClock(); }, {passive:true});
    window.addEventListener('online', () => { apiStatus='connecting'; updateLiveClock(); syncMoneyData(); }, {passive:true});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) syncMoneyData(); }, {passive:true});

    const format = (value, isTyping=false) => {
      if (value === '' || value == null) return '';
      const source = String(value).replace(/,/g,'').replace(/[^0-9.]/g,'');
      if (!source) return '';
      const dot = source.indexOf('.');
      const integer = (dot < 0 ? source : source.slice(0,dot)).replace(/^0+(?=\d)/,'') || '0';
      const fraction = dot < 0 ? '' : source.slice(dot + 1).replace(/\./g,'');
      const grouped = integer.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return fraction || (isTyping && dot >= 0) ? `${grouped}.${fraction}` : grouped;
    };
    const raw = value => {
      const number = Number.parseFloat(String(value).replace(/,/g,''));
      return Number.isFinite(number) && number > 0 ? number : 0;
    };
    function getAdjustedRate(baseRate, mmkAmount, isBuyTab) {
      const rate = Number(baseRate);
      const amount = Math.max(0, Number(mmkAmount) || 0);
      if (!Number.isFinite(rate) || rate <= 0) return 0;
      const percentage = amount <= 100000 ? 1 : amount >= 150000000 ? .25 : 1 - ((amount - 100000) / 149900000 * .75);
      const multiplier = 1 + percentage / 100;
      return isBuyTab ? rate / multiplier : rate * multiplier;
    }
    function updateGlow(hasValue) {
      document.querySelectorAll('.tab-content.active .money-input-box').forEach(box => box.classList.toggle('highlighted', hasValue));
    }
    function setOutput(id, value) { $(id).value = value; }
    function handleForeignInput(input, outputId, isBuy) {
      lastActiveInput = input;
      input.value = format(input.value, true);
      const foreign = raw(input.value);
      if (!foreign) { setOutput(outputId,''); updateGlow(false); return; }
      const rate = Number(isBuy ? CURRENCIES[selectedCurrency].buy : CURRENCIES[selectedCurrency].sell);
      if (!Number.isFinite(rate) || rate <= 0) { setOutput(outputId,''); return; }
      const adjusted = getAdjustedRate(rate, foreign * rate, isBuy);
      updateGlow(true); setOutput(outputId, adjusted ? format(Math.round(foreign * adjusted)) : '');
    }
    function handleMMKInput(input, outputId, isBuy) {
      lastActiveInput = input;
      input.value = format(input.value, true);
      const mmk = raw(input.value);
      if (!mmk) { setOutput(outputId,''); updateGlow(false); return; }
      const rate = Number(isBuy ? CURRENCIES[selectedCurrency].buy : CURRENCIES[selectedCurrency].sell);
      if (!Number.isFinite(rate) || rate <= 0) { setOutput(outputId,''); return; }
      const adjusted = getAdjustedRate(rate, mmk, isBuy);
      updateGlow(true); setOutput(outputId, adjusted ? format(Number((mmk / adjusted).toFixed(2))) : '');
    }
    els.foreignBuy.addEventListener('input', () => handleForeignInput(els.foreignBuy,'mmkBuy',true));
    els.mmkBuy.addEventListener('input', () => handleMMKInput(els.mmkBuy,'foreignBuy',true));
    els.mmkSell.addEventListener('input', () => handleMMKInput(els.mmkSell,'foreignSell',false));
    els.foreignSell.addEventListener('input', () => handleForeignInput(els.foreignSell,'mmkSell',false));

    function switchTab(name) {
      if (currentTabMode === name) return; currentTabMode = name;
      const buy = name === 'buy';
      els.indicator.classList.toggle('sell-mode', !buy); els.tabBuy.classList.toggle('active', buy); els.tabSell.classList.toggle('active', !buy);
      els.buyContent.classList.toggle('active', buy); els.sellContent.classList.toggle('active', !buy);
      document.querySelectorAll('.money-input-box').forEach(box => box.classList.remove('highlighted')); lastActiveInput = null;
    }
    let touchStartXTab = 0, isDraggingTab = false, indicatorWidth = 0;
    els.tabContainer.addEventListener('touchstart', e => { touchStartXTab=e.changedTouches[0].clientX; isDraggingTab=true; indicatorWidth=els.indicator.offsetWidth; els.indicator.style.transition='none'; }, {passive:true});
    els.tabContainer.addEventListener('touchmove', e => {
      if (!isDraggingTab) return; const diff=e.changedTouches[0].clientX-touchStartXTab;
      const move=currentTabMode==='buy' ? Math.max(0,Math.min(diff,indicatorWidth)) : Math.max(-indicatorWidth,Math.min(diff,0))+indicatorWidth;
      els.indicator.style.transform=`translateX(${move}px)`;
    }, {passive:true});
    els.tabContainer.addEventListener('touchend', e => {
      if (!isDraggingTab) return; isDraggingTab=false; els.indicator.style.transition='transform .35s cubic-bezier(.4,0,.2,1)'; els.indicator.style.transform='';
      const end=e.changedTouches[0].clientX, threshold=indicatorWidth/3;
      if ((currentTabMode==='buy' && end-touchStartXTab>threshold) || (currentTabMode==='sell' && touchStartXTab-end>threshold)) switchTab(currentTabMode==='buy'?'sell':'buy');
    }, {passive:true});

    updateDisplay(); handleViewportChange(); updateLiveClock(); syncMoneyData(); scheduleRateSync();
  </script>
