<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>ᗩᗰᕮᑎ Money</title>
    <meta property="og:title" content="ᗩᗰᕮᑎ  Money">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --card-bg: #ffffff; 
            --glow-blue: #bae6fd;
            --glow-purple: #e0e7ff;
            --title-clr: #0f172a;
            --messenger-clr: #0084ff; 
            --viber-clr: #7360f2; 
            --telegram-clr: #229ED9; 
            --whatsapp-clr: #25D366;
            --line-clr: #06C755; 
            --date-color: #7c3aed; 
            --vv-height: 100vh;
            --line-weight: 3px;
            --rainbow-1: linear-gradient(90deg, #ff8a80, #ffd180, #ffff8d, #b9f6ca, #80d8ff, #b388ff, #ff8a80);
            --rainbow-2: linear-gradient(120deg, #b9f6ca, #80d8ff, #b388ff, #ff8a80, #ffd180, #ffff8d, #b9f6ca);
            --rainbow-3: linear-gradient(60deg, #b388ff, #80d8ff, #b9f6ca, #ffff8d, #ffd180, #ff8a80, #b388ff);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, input, label, .tab, .clock-time, .clock-date, .agent-title, .footer-clean { 
            font-family: 'myanmarayar3', 'Myanmar3', 'Pyidaungsu', 'Noto Sans Myanmar', sans-serif; 
        }
        
        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: var(--vv-height); 
            height: var(--vv-height);
            width: 100vw;
            padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
            overflow: hidden; 
        }

        @keyframes flowCard {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes flowTabs {
            0% { background-position: 200% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flowInput {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .card { 
            width: 100%; 
            max-width: 380px; 
            height: 96%; 
            max-height: 720px; 
            border-radius: 32px; 
            padding: var(--line-weight); 
            background: #ffffff;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(15, 23, 42, 0.02);
            display: flex;
            margin: auto; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: var(--line-weight);
            background: var(--rainbow-1);
            background-size: 200% 100%;
            animation: flowCard 9s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
        }
        
        .card-inner { 
            background: var(--card-bg); 
            border-radius: 28px; 
            width: 100%; 
            height: 100%;
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            padding: 24px; 
            justify-content: space-evenly; 
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .logo-row {
            width: max-content; 
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: stretch; 
            text-align: center;
            transition: all 0.25s ease;
        }
        
        .money-app h1 { 
            font-size: 5rem;
            font-weight: 900;
            font-family: 'MedievalSharp', sans-serif; 
            margin: 0; 
            line-height: 0.95; 
            letter-spacing: 2px; 
            filter: drop-shadow(2px 3px 4px rgba(15, 23, 42, 0.15));
            text-align: center;
        }

        .c-yellow { color: #f59e0b; }
        .c-green { color: #10b981; }
        .c-red { color: #ef4444; }
        .c-blue { color: #3b82f6; }
        
        .agent-title { 
            font-size: 0.98rem;
            margin-top: 8px; 
            font-weight: 800; 
            display: flex; 
            justify-content: space-between; 
            text-transform: uppercase; 
            color: var(--title-clr);
            width: 100%;
            white-space: nowrap;
            padding: 0 2px;
            letter-spacing: 0.5px;
        }

        .agent-title .clr-mobile { color: #d97706; }
        .agent-title .clr-money { color: #059669; }
        .agent-title .clr-agent { color: #dc2626; }
        
        #status-light { 
            display: flex; 
            flex-direction: row;
            align-items: center; 
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: all 0.25s ease;
        }

        .clock-time, .clock-date {
            color: var(--date-color);
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            transition: color 0.4s ease;
        }
        
        .clock-time { font-size: 1.1rem; }
        .clock-date { font-size: 1.1rem; text-transform: uppercase; }
        
        .tabs { 
            position: relative;
            width: 100%;
            display: flex; 
            background: #f1f5f9; 
            padding: 5px; 
            border-radius: 50px; 
            box-shadow: inset 0 2px 4px 0 rgba(15, 23, 42, 0.06);
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        .tabs::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: var(--line-weight);
            background: var(--rainbow-2);
            background-size: 200% 100%;
            animation: flowTabs 6.5s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
        }
        
        .slide-indicator {
            position: absolute;
            top: 5px;
            bottom: 5px;
            left: 5px;
            width: calc(50% - 5px);
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            transform: translateX(0);
        }
        
        .slide-indicator.sell-mode {
            transform: translateX(100%);
        }

        .tab { 
            position: relative;
            z-index: 2;
            flex: 1; 
            padding: 13px 4px; 
            text-align: center; 
            font-weight: 800; 
            color: #64748b; 
            font-size: 1rem; 
            cursor: pointer; 
            border-radius: 50px; 
            transition: color 0.35s cubic-bezier(0.4, 0, 0.2, 1); 
            letter-spacing: 0.3px;
        }

        .tab.active { 
            color: #ffffff; 
        }
        
        .inputs-container {
            width: 100%;
        }
        
        .content { display: none; width: 100%; } 
        .content.active { 
            display: flex; 
            flex-direction: column;
            gap: 18px; 
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .money-input-box { 
            background: transparent;
            position: relative;
            padding: 4px 2px; 
            transition: all 0.3s ease; 
        }

        .money-input-box::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: var(--line-weight);
            background: var(--rainbow-3);
            background-size: 200% 100%;
            animation: flowInput 5s linear infinite;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .inputs-container > div > div:nth-child(2) .money-input-box::after {
            animation-duration: 4.2s;
            animation-delay: -2s;
        }

        .money-input-box:focus-within::after, .money-input-box.highlighted::after {
            opacity: 1;
            box-shadow: 0 2px 8px rgba(179, 136, 255, 0.3);
        }
        
        .money-input-box input { 
            width: 100%; 
            border: none; 
            background: transparent; 
            font-size: 2.3rem; 
            text-align: right; 
            font-weight: 800; 
            color: #0f172a; 
            outline: none; 
            position: relative;
            z-index: 1;
            letter-spacing: 0.5px;
        }

        .money-app label { 
            display: block; 
            font-weight: 800; 
            color: #475569; 
            font-size: 0.92rem; 
            text-align: left; 
            padding-left: 2px; 
            letter-spacing: 0.5px; 
            text-transform: uppercase; 
        }
        
        .social-container { 
            display: flex; 
            justify-content: space-evenly; 
            align-items: center; 
            width: 100%; 
            max-width: 320px;
            margin: 0 auto;
            transition: all 0.25s ease;
        }
        
        .social-icon { 
            font-size: 2.2rem; 
            transition: all 0.3s ease; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 50px; 
            height: 50px; 
            background: transparent; 
            text-decoration: none !important; 
        }
        .social-icon * { text-decoration: none !important; border: none !important; }
        
        .messenger { color: var(--messenger-clr); }
        .viber { color: var(--viber-clr); }
        .telegram { color: var(--telegram-clr); }
        .whatsapp { color: var(--whatsapp-clr); }
        .line { color: var(--line-clr); }
        .social-icon:hover { transform: translateY(-4px) scale(1.12); }
        
        .footer-clean { 
            font-size: 0.82rem; 
            font-weight: 800; 
            color: #94a3b8; 
            letter-spacing: 0.5px; 
            display: block; 
            text-align: center; 
            width: 100%; 
            text-transform: uppercase; 
            transition: all 0.25s ease; 
        }

        @media (max-height: 650px) {
            .card-inner { padding: 18px; }
            .money-app h1 { font-size: 4.4rem; }
            .agent-title { font-size: 0.88rem; margin-top: 6px; }
            .clock-time, .clock-date { font-size: 0.95rem; }
            .tab { padding: 10px 2px; font-size: 0.88rem; }
            .content.active { gap: 12px; }
            .money-input-box input { font-size: 2rem; }
            .money-app label { font-size: 0.82rem; }
            .social-icon { font-size: 1.95rem; width: 44px; height: 44px; }
            .footer-clean { font-size: 0.75rem; }
        }

        body.keyboard-open .card {
            height: 100%;
            border-radius: 16px;
            box-shadow: none;
        }

        body.keyboard-open .card-inner {
            padding: 12px 16px;
            justify-content: center;
            gap: 14px;
        }

        body.keyboard-open .logo-row,
        body.keyboard-open #status-light,
        body.keyboard-open .social-container,
        body.keyboard-open .footer-clean {
            display: none !important;
        }

        body.keyboard-open .content.active {
            gap: 14px;
        }

        body.keyboard-open .money-input-box input {
            font-size: 2rem;
        }
    </style>
</head>
<body>

<div class="card money-app" id="mainCard">
    <div class="card-inner">
        
        <div class="logo-row">
            <h1>
                <span class="c-yellow">ᗩ</span><span class="c-green">ᗰ</span><span class="c-red">ᕮ</span><span class="c-blue">ᑎ</span>
            </h1>
            <div class="agent-title">
                <span class="clr-mobile">M</span><span class="clr-mobile">O</span><span class="clr-mobile">B</span><span class="clr-mobile">I</span><span class="clr-mobile">L</span><span class="clr-mobile">E</span><span class="clr-money">M</span><span class="clr-money">O</span><span class="clr-money">N</span><span class="clr-money">E</span><span class="clr-money">Y</span><span class="clr-agent">A</span><span class="clr-agent">G</span><span class="clr-agent">E</span><span class="clr-agent">N</span><span class="clr-agent">T</span>
            </div>
        </div>
        
        <div id="status-light"></div>
        
        <div class="tabs" id="tabContainer">
            <div class="slide-indicator" id="slideIndicator"></div>
            <div class="tab active" id="tabBuy" onclick="switchTab('buy')">ဘတ်ပေးကျပ်ယူ</div>
            <div class="tab" id="tabSell" onclick="switchTab('sell')">ကျပ်ပေးဘတ်ယူ</div>
        </div>

        <div class="inputs-container">
            <div id="buy" class="content active">
                <div>
                    <label>‌ငွေပမာဏ {THB}</label>
                    <div class="money-input-box"><input type="text" id="thbBuy" placeholder="0" inputmode="decimal"></div>
                </div>
                <div>
                    <label>‌ငွေပမာဏ {MMK}</label>
                    <div class="money-input-box"><input type="text" id="mmkBuy" placeholder="0" inputmode="decimal"></div>
                </div>
            </div>
            
            <div id="sell" class="content">
                <div>
                    <label>ငွေပမာဏ {MMK}</label>
                    <div class="money-input-box"><input type="text" id="mmkSell" placeholder="0" inputmode="decimal"></div>
                </div>
                <div>
                    <label>ငွေပမာဏ {THB}</label>
                    <div class="money-input-box"><input type="text" id="thbSell" placeholder="0" inputmode="decimal"></div>
                </div>
            </div>
        </div>

        <div class="social-container">
            <a href="https://m.me/MobileMoneyAgent" class="social-icon messenger"><i class="fa-brands fa-facebook-messenger"></i></a>
            <a href="viber://chat?number=%2B66947841411" class="social-icon viber"><i class="fa-brands fa-viber"></i></a>
            <a href="https://t.me/amenmobilemoneyagent" class="social-icon telegram"><i class="fa-brands fa-telegram"></i></a>
            <a href="https://api.whatsapp.com/send?phone=66947841411" class="social-icon whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://line.me/ti/p/~mobilemoneyagent" class="social-icon line"><i class="fa-brands fa-line"></i></a>
        </div>

        <span class="footer-clean">Mobile Money Agent © 2026</span>

    </div>
</div>

<script>
    const MONEY_API = 'https://script.google.com/macros/s/AKfycbzELl1tVZ-b5nDWUmqdb1j13Vo_SSlSYUdPhL0NO9zfmRC0mZmqA8X9BEmFHoIk-faTYQ/exec';
    let SETTINGS = { buyBase: 780, sellBase: 760 };
    let lastActiveInput = null;
    let apiStatus = 'connecting'; 
    let currentTabMode = 'buy';

    function handleViewportChange() {
        if (window.visualViewport) {
            const vv = window.visualViewport;
            document.documentElement.style.setProperty('--vv-height', `${vv.height}px`);
            
            if (window.innerHeight - vv.height > 140) {
                document.body.classList.add('keyboard-open');
            } else {
                document.body.classList.remove('keyboard-open');
            }
        } else {
            document.documentElement.style.setProperty('--vv-height', `${window.innerHeight}px`);
        }
    }

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', handleViewportChange);
        window.visualViewport.addEventListener('scroll', handleViewportChange);
    }
    window.addEventListener('resize', handleViewportChange);
    window.addEventListener('load', handleViewportChange);

    function updateLiveClock() {
        const now = new Date();
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dayName = days[now.getDay()];
        
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        
        const statusLight = document.getElementById('status-light');

        let statusColor = '#f59e0b';
        if (apiStatus === 'online') {
            statusColor = '#10b981';
        } else if (apiStatus === 'offline') {
            statusColor = '#ef4444';
        }

        statusLight.innerHTML = `
            <div class="clock-time" style="color: ${statusColor}">${hh}:${min}:${ss}</div>
            <div class="clock-date" style="color: ${statusColor}">${dayName} ${dd},${mm},${yyyy}</div>
        `;
    }

    async function syncMoneyData() {
        try {
            const res = await fetch(`${MONEY_API}?cache=${Date.now()}`);
            const data = await res.json();
            apiStatus = 'online';
            
            let isRateChanged = false;
            if (data.buyBase && parseFloat(data.buyBase) !== SETTINGS.buyBase) { SETTINGS.buyBase = parseFloat(data.buyBase); isRateChanged = true; }
            if (data.sellBase && parseFloat(data.sellBase) !== SETTINGS.sellBase) { SETTINGS.sellBase = parseFloat(data.sellBase); isRateChanged = true; }
            if (isRateChanged && lastActiveInput) { lastActiveInput.dispatchEvent(new Event('input')); }
        } catch (e) {
            apiStatus = 'offline';
        }
        updateLiveClock(); 
    }

    updateLiveClock();
    setInterval(updateLiveClock, 1000);
    syncMoneyData(); 
    setInterval(syncMoneyData, 3000);

    const format = (v, isTyping = false) => {
        if (!v && v !== 0) return "";
        let parts = v.toString().split(".");
        parts[0] = parts[0].replace(/,/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        if (parts.length > 1) return parts[0] + "." + parts[1];
        return parts[0] + (isTyping && v.toString().includes(".") ? "." : "");
    };
    
    const raw = (v) => parseFloat(v.toString().replace(/,/g, "")) || 0;

    function getSmoothMultiplier(mmkAmount, isBuyTab) {
        let percentage = 1.0;
        if (mmkAmount <= 100000) percentage = 1.0;
        else if (mmkAmount >= 150000000) percentage = 0.25;
        else {
            let ratio = (mmkAmount - 100000) / (150000000 - 100000);
            percentage = 1.0 - (ratio * (1.0 - 0.25));
        }
        return isBuyTab ? (1.0 + (percentage/100)) : (1.0 - (percentage/100));
    }

    function updateGlow(inputEl, hasValue) {
        let parentContent = inputEl.closest('.content');
        if (parentContent) {
            parentContent.querySelectorAll('.money-input-box').forEach(box => {
                hasValue ? box.classList.add('highlighted') : box.classList.remove('highlighted');
            });
        }
    }
    
    function handleTHBInput(inputEl, outputId, baseRate, isBuy) {
        lastActiveInput = inputEl; let thb = raw(inputEl.value); 
        inputEl.value = format(inputEl.value, true);
        if (!inputEl.value) { document.getElementById(outputId).value = ""; updateGlow(inputEl, false); return; }
        updateGlow(inputEl, true);
        let roughMMK = (thb / baseRate) * 100000;
        let baseTHB = thb / getSmoothMultiplier(roughMMK, isBuy);
        document.getElementById(outputId).value = format(Math.floor((baseTHB / baseRate) * 100000));
    }

    function handleMMKInput(inputEl, outputId, baseRate, isBuy) {
        lastActiveInput = inputEl; let mmk = raw(inputEl.value); 
        inputEl.value = format(inputEl.value, true);
        if (!inputEl.value) { document.getElementById(outputId).value = ""; updateGlow(inputEl, false); return; }
        updateGlow(inputEl, true);
        let baseTHB = (mmk / 100000) * baseRate;
        document.getElementById(outputId).value = format(parseFloat((baseTHB * getSmoothMultiplier(mmk, isBuy)).toFixed(2)));
    }

    document.getElementById('thbBuy').oninput = function() { handleTHBInput(this, 'mmkBuy', SETTINGS.buyBase, true); };
    document.getElementById('mmkBuy').oninput = function() { handleMMKInput(this, 'thbBuy', SETTINGS.buyBase, true); };
    document.getElementById('mmkSell').oninput = function() { handleMMKInput(this, 'thbSell', SETTINGS.sellBase, false); };
    document.getElementById('thbSell').oninput = function() { handleTHBInput(this, 'mmkSell', SETTINGS.sellBase, false); };

    function switchTab(name) {
        if (currentTabMode === name) return;
        currentTabMode = name;

        const indicator = document.getElementById('slideIndicator');
        const tabBuy = document.getElementById('tabBuy');
        const tabSell = document.getElementById('tabSell');

        if (name === 'buy') {
            indicator.classList.remove('sell-mode');
            tabBuy.classList.add('active');
            tabSell.classList.remove('active');
        } else {
            indicator.classList.add('sell-mode');
            tabSell.classList.add('active');
            tabBuy.classList.remove('active');
        }

        document.querySelectorAll('.content').forEach(c => { 
            c.classList.remove('active'); 
            c.querySelectorAll('.money-input-box').forEach(b => b.classList.remove('highlighted')); 
        });
        document.getElementById(name).classList.add('active');
        lastActiveInput = null;
    }

    const tabContainer = document.getElementById('tabContainer');
    const indicator = document.getElementById('slideIndicator');
    
    let touchStartX = 0;
    let isDragging = false;
    let indicatorWidth = 0;

    tabContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].clientX;
        isDragging = true;
        indicatorWidth = indicator.offsetWidth;
        indicator.style.transition = 'none'; 
    }, {passive: true});

    tabContainer.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let currentX = e.changedTouches[0].clientX;
        let diff = currentX - touchStartX;
        
        let movePx = 0;
        if (currentTabMode === 'buy') {
            movePx = Math.max(0, Math.min(diff, indicatorWidth));
        } else {
            movePx = Math.max(-indicatorWidth, Math.min(diff, 0)) + indicatorWidth;
        }
        indicator.style.transform = `translateX(${movePx}px)`;
    }, {passive: true});

    tabContainer.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        indicator.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
        indicator.style.transform = ''; 
        
        let touchEndX = e.changedTouches[0].clientX;
        let threshold = indicatorWidth / 3;

        if (currentTabMode === 'buy' && touchEndX - touchStartX > threshold) {
            switchTab('sell'); 
        } else if (currentTabMode === 'sell' && touchStartX - touchEndX > threshold) {
            switchTab('buy');
        }
    }, {passive: true});
</script>
</body>
</html>
